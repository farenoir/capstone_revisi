version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: atk_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: capstone
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: atk_backend_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://root:rootpassword@db:3306/capstone"
      JWT_SECRET: "sistem-atk-super-secret-key-production-ready"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: "http://localhost"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: atk_frontend_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data:
